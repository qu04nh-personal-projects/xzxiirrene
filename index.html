          <button class="wx-btn" id="wxConfirmCancel">Cancel</button>
          <button class="wx-btn wx-primary" id="wxConfirmOk">OK</button>

    <div
      id="controlPanel"
      style="display: none"
      class="fixed bottom-4 right-4 z-20 flex flex-wrap items-center gap-2 rounded-xl border border-white/10 bg-[#0d1018]/80 px-3 py-2 text-xs backdrop-blur-md shadow-2xl transition-opacity duration-300"
    >
      <button
        id="btnPlayPause"
        class="rounded-lg bg-white/10 px-2.5 py-1.5 font-medium text-amber-300 hover:bg-white/20 active:scale-95 transition"
      >
        ❚❚ Pause
      </button>
      <button
        id="btnReplay"
        class="rounded-lg bg-white/10 px-2.5 py-1.5 font-medium text-emerald-300 hover:bg-white/20 active:scale-95 transition"
      >
        ↺ Build
      </button>
      <button
        id="btnInstant"
        class="rounded-lg bg-white/10 px-2.5 py-1.5 font-medium text-sky-300 hover:bg-sky-400/30 active:scale-95 transition"

        ★ Full (19.5s)
      </button>
      <button
        id="btnBuildColor"
        class="rounded-lg bg-pink-500/20 px-2.5 py-1.5 font-medium text-pink-300 hover:bg-pink-500/30 active:scale-95 transition"
      >
        🎨 Build Color: Pink
      </button>
      <div
        class="hidden sm:flex items-center gap-2 pl-1 border-l border-white/10"
      >

        <input

          class="w-20"

        <span id="zoomLabel" class="text-amber-300 font-medium w-8">0.9x</span>
      </div>
    </div>

    <script>
      (() => {
        const CONFIG = {
          numBaubles: 30, // Giảm từ 55 xuống 30
          numBows: 10, // Giảm từ 20 xuống 10
          numLights: 100, // Giảm từ 220 xuống 100
          snowCount: 150, // Giảm từ 500 xuống 150 (giảm đáng kể lượng tuyết tính toán)
          buildSpeed: 1.8,
          maxFps: 30, // Giới hạn FPS ở mức 30 thay vì thả rỗng (giúp tiết kiệm pin và giảm lag rõ rệt trên mobile)
        };

        const BUILD_COLORS = [
          {
            name: "Pink",
            r: 1.45,
            g: 1.35,
            b: 1.15,
            labelColor: "text-pink-300",
            bgBtn: "bg-pink-500/20 hover:bg-pink-500/30",
          },
          {
            name: "Gold",
            r: 1.55,
            g: 1.3,
            b: 0.85,
            labelColor: "text-amber-300",
            bgBtn: "bg-amber-500/20 hover:bg-amber-500/30",
          },
          {
            name: "Ice Blue",
            r: 0.9,
            g: 1.4,
            b: 1.55,
            labelColor: "text-sky-300",
            bgBtn: "bg-sky-500/20 hover:bg-sky-500/30",
          },
          {
            name: "Bright White",
            r: 1.6,
            g: 1.6,
            b: 1.6,
            labelColor: "text-slate-100",
            bgBtn: "bg-slate-500/20 hover:bg-slate-500/30",
          },
        ];
        let currentBuildColorIdx = 0;

        const canvas = document.getElementById("asciiCanvas");
        const ctx = canvas.getContext("2d", { alpha: false });
        const bloomCanvas = document.createElement("canvas");
        const bloomCtx = bloomCanvas.getContext("2d");

        const TAU = Math.PI * 2;
        const Y0 = 0.42,
          Y1 = 2.55;
        const CHAR_RAMP = " .:-=+*#%@";

        const KIND = {
          NEEDLE: 0,
          TRUNK: 1,
          BALL: 2,
          BOW: 3,
          LIGHT: 4,
          GARLAND: 5,
          GIFT: 6,
          SNOWCAP: 7,
          GROUND: 8,
          STAR_CORE: 9,
          STAR_RAY: 10,
        };

        function unit(v) {
          const norm = Math.hypot(v[0], v[1], v[2]);
          if (norm < 1e-8) return [0, 1, 0];
          return [v[0] / norm, v[1] / norm, v[2] / norm];
        }

        function fibSphere(n) {
          const pts = [];
          const phi = Math.PI * (3 - Math.sqrt(5));
          for (let i = 0; i < n; i++) {
            const y = 1 - (i / (n - 1)) * 2;
            const radius = Math.sqrt(1 - y * y);
            const theta = phi * i;
            pts.push([Math.cos(theta) * radius, y, Math.sin(theta) * radius]);
          }
          return pts;
        }

        function envelope(y) {
          const f = Math.max(0, Math.min(1, (y - Y0) / (Y1 - Y0)));
          return 0.03 + 0.84 * Math.pow(1 - f, 1.08);
        }

        function snowNoise(x, z) {
          return (
            Math.sin(x * 1.8 + Math.cos(z * 1.5)) *
              Math.cos(z * 2.0 - Math.sin(x * 1.2)) *
              0.045 +
            Math.sin(x * 4.5) * Math.cos(z * 4.5) * 0.015
          );
        }

        class SceneCloud {
          constructor() {
            this.x = [];
            this.y = [];
            this.z = [];
            this.nx = [];
            this.ny = [];
            this.nz = [];
            this.r = [];
            this.g = [];
            this.b = [];
            this.kind = [];
            this.t0 = [];
            this.phase = [];
            this.shine = [];
          }
          add(
            rx,
            ry,
            rz,
            rnx,
            rny,
            rnz,
            cr,
            cg,
            cb,
            k,
            tVal = 0,
            ph = 0,
            sh = 0,
          ) {
            this.x.push(rx);
            this.y.push(ry);
            this.z.push(rz);
            this.nx.push(rnx);
            this.ny.push(rny);
            this.nz.push(rnz);
            this.r.push(cr);
            this.g.push(cg);
            this.b.push(cb);
            this.kind.push(k);
            this.t0.push(tVal);
            this.phase.push(ph);
            this.shine.push(sh);
          }
        }

        function buildTreeScene() {
          const cloud = new SceneCloud();
          const tips = [];
          const tiersCount = 70;

          for (let i = 0; i < tiersCount; i++) {
            const tierFrac = i / (tiersCount - 1);
            const y = Y0 + 0.01 + tierFrac * (Y1 - Y0 - 0.05);
            const R = envelope(y);
            const tierSpacing = (Y1 - Y0) / tiersCount;

            const nCore = Math.floor(420 * (R / 0.88));
            for (let cIdx = 0; cIdx < nCore; cIdx++) {
              const coreRadius =
                (0.04 + Math.pow(Math.random(), 0.75) * 0.66) * R;
              const coreAngle = Math.random() * TAU;
              const coreY = y + (Math.random() - 0.5) * tierSpacing * 1.3;
              const px = coreRadius * Math.cos(coreAngle);
              const pz = coreRadius * Math.sin(coreAngle);
              const nrm = unit([
                Math.cos(coreAngle),
                0.35,
                Math.sin(coreAngle),
              ]);

              const ao = 0.38 + 0.62 * (coreRadius / R);
              const tone = ao * (0.85 + Math.random() * 0.15);
              const cr = 0.98 * tone;
              const cg = 0.82 * tone;
              const cb = 0.89 * tone;

              const tVal = 0.2 + 3.2 * tierFrac;
              cloud.add(
                px,
                coreY,
                pz,
                nrm[0],
                nrm[1],
                nrm[2],
                cr,
                cg,
                cb,
                KIND.NEEDLE,
                tVal,
              );
            }

            const nb = Math.floor(14 + 18 * (1 - tierFrac));
            for (let b = 0; b < nb; b++) {
              const a = (TAU * b) / nb + i * 0.618 * TAU;
              const ca = Math.cos(a),
                sa = Math.sin(a);
              const L = R * (0.84 + Math.random() * 0.22);
              const nCount = Math.floor(660 * L);

              for (let sIdx = 0; sIdx < nCount; sIdx++) {
                const s = Math.pow(Math.random(), 0.68);
                const sideAngle = ((sIdx % 3) - 1) * 0.32;
                const spread =
                  (0.045 + 0.14 * s) * (Math.random() - 0.5) * 2 +
                  sideAngle * s * 0.18;
                const yy =
                  y +
                  0.06 * s * L -
                  0.2 * Math.pow(s * L, 2) +
                  (Math.random() - 0.5) * 0.035;
                const px = ca * (s * L) - sa * spread;
                const pz = sa * (s * L) + ca * spread;
                const nrm = unit([
                  ca * 0.75 + (Math.random() - 0.5) * 0.2,
                  0.55,
                  sa * 0.75 + (Math.random() - 0.5) * 0.2,
                ]);
                const ao = 0.45 + 0.55 * Math.pow(s, 1.25);
                const tone = ao * (0.88 + Math.random() * 0.12);

                const tVal = 0.25 + 3.2 * tierFrac + 0.2 * s;

                const cr = 0.99 * ao * tone;
                const cg = 0.85 * ao * tone;
                const cb = 0.92 * ao * tone;

                if (s > 0.82 && Math.random() < 0.015 && nrm[1] > 0.45) {
                  cloud.add(
                    px,
                    yy,
                    pz,
                    0,
                    1,
                    0,
                    1.0,
                    0.96,
                    0.98,
                    KIND.SNOWCAP,
                    tVal + 0.1,
                    0,
                    0.1,
                  );
                } else {
                  cloud.add(
                    px,
                    yy,
                    pz,
                    nrm[0],
                    nrm[1],
                    nrm[2],
                    cr,
                    cg,
                    cb,
                    KIND.NEEDLE,
                    tVal,
                  );
                }
              }
              tips.push([
                ca * L * 0.93,
                y + 0.06 * L - 0.2 * Math.pow(L, 2),
                sa * L * 0.93,
              ]);
            }
          }

          for (let ih = 0; ih < 40; ih++) {
            const uTrunk = ih / 39;
            const h = -0.06 + uTrunk * 0.54;
            const flare =
              h < 0.15
                ? 1.0 + 0.65 * Math.pow(Math.max(0, (0.15 - h) / 0.21), 1.6)
                : 1.0;
            const trunkR = 0.088 * flare;

            for (let ia = 0; ia < 28; ia++) {
              const a = (ia / 28) * TAU;
              const bark = 0.72 + 0.28 * Math.sin(h * 50 + a * 4);
              const tVal = 0.1 + 0.18 * uTrunk;
              cloud.add(
                trunkR * Math.cos(a),
                h,
                trunkR * Math.sin(a),
                Math.cos(a),
                h < 0.05 ? -0.2 : 0,
                Math.sin(a),
                0.4 * bark,
                0.24 * bark,
                0.14 * bark,
                KIND.TRUNK,
                tVal,
              );
            }
          }

          const ribbonSteps = 1800;
          const ribbonTracks = [-0.018, -0.009, 0, 0.009, 0.018];

          for (let i = 0; i < ribbonSteps; i++) {
            const u = i / (ribbonSteps - 1);
            const yg = Y0 + 0.14 + (Y1 - Y0 - 0.44) * u;
            const ag = TAU * 3.6 * u + 0.9;
            const swag = -0.058 * Math.abs(Math.sin(ag * 2.5));
            const rg = envelope(yg) + 0.035;
            const tVal = 0.8 + 3.2 * u;

            const colorHue = i % 5;
            let rGlow = 1.35,
              gGlow = 0.88,
              bGlow = 1.05;
            if (colorHue === 0) {
              rGlow = 1.35;
              gGlow = 1.12;
              bGlow = 0.72;
            } else if (colorHue === 2) {
              rGlow = 1.4;
              gGlow = 0.75;
              bGlow = 0.92;
            }

            for (let w = 0; w < ribbonTracks.length; w++) {
              const wOff = ribbonTracks[w];
              const curR = rg + wOff * 0.4;
              const curY = yg + swag + wOff * 0.75;
              cloud.add(
                curR * Math.cos(ag),
                curY,
                curR * Math.sin(ag),
                Math.cos(ag),
                0.2,
                Math.sin(ag),
                rGlow,
                gGlow,
                bGlow,
                KIND.GARLAND,
                tVal,
                0,
                1.35,
              );
            }
          }

          const baubleSphere = fibSphere(38);
          const baubleColors = [
            [1.38, 0.78, 0.92],
            [1.35, 1.02, 0.62],
            [1.4, 0.58, 0.78],
            [1.25, 1.25, 1.35],
            [1.35, 0.88, 0.98],
          ];

          for (let k = 0; k < CONFIG.numBaubles; k++) {
            const u = 0.05 + Math.random() * 0.87;
            const y = Y0 + 0.08 + (Y1 - Y0 - 0.32) * u;
            const R = envelope(y);

            const a = Math.random() * TAU;
            const swag = -0.045 * Math.abs(Math.sin((a + 0.9) * 2.5));
            const yJitter = (Math.random() - 0.5) * 0.06;
            const radOffset = 0.02 + Math.random() * 0.04;

            const cX = Math.cos(a) * (R + radOffset);
            const cY = y + swag + yJitter;
            const cZ = Math.sin(a) * (R + radOffset);

            const col =
              baubleColors[Math.floor(Math.random() * baubleColors.length)];
            const tVal = 4.5 + Math.random() * 3.5;

            const heightScale = 1.1 - 0.65 * u;
            const baubleRadius = (0.025 + Math.random() * 0.035) * heightScale;

            for (let sp = 0; sp < baubleSphere.length; sp++) {
              const s = baubleSphere[sp];
              cloud.add(
                cX + s[0] * baubleRadius,
                cY + s[1] * baubleRadius * 1.12,
                cZ + s[2] * baubleRadius,
                s[0],
                s[1],
                s[2],
                col[0],
                col[1],
                col[2],
                KIND.BALL,
                tVal,
                0,
                1.15,
              );
            }
          }

          for (let b = 0; b < CONFIG.numBows; b++) {
            const u = 0.15 + Math.random() * 0.75;
            const y = Y0 + 0.1 + (Y1 - Y0 - 0.35) * u;
            const R = envelope(y);
            const a = Math.random() * TAU;
            const radOffset = 0.03 + Math.random() * 0.035;

            const bX = Math.cos(a) * (R + radOffset);
            const bY = y + (Math.random() - 0.5) * 0.04;
            const bZ = Math.sin(a) * (R + radOffset);

            const bowColor =
              Math.random() < 0.75 ? [1.4, 0.78, 0.92] : [1.35, 1.05, 0.7];
            const tVal = 4.8 + Math.random() * 3.0;

            for (let dx = -2; dx <= 2; dx++) {
              for (let dy = -1; dy <= 1; dy++) {
                for (let dz = -1; dz <= 1; dz++) {
                  if (Math.abs(dx) + Math.abs(dy) <= 3) {
                    cloud.add(
                      bX + dx * 0.012,
                      bY + dy * 0.012,
                      bZ + dz * 0.012,
                      0,
                      1,
                      0,
                      bowColor[0],
                      bowColor[1],
                      bowColor[2],
                      KIND.BOW,
                      tVal,
                      0,
                      1.3,
                    );
                  }
                }
              }
            }
          }

          const bulbSphere = fibSphere(8);
          const bulbRadius = 0.024;
          const lightColors = [
            [1.4, 1.15, 0.65],
            [1.35, 1.1, 0.55],
            [1.4, 1.05, 0.7],
          ];

          const lightStep = Math.max(
            1,
            Math.floor(tips.length / CONFIG.numLights),
          );
          for (
            let i = 0;
            i < CONFIG.numLights && i * lightStep < tips.length;
            i++
          ) {
            const tp = tips[i * lightStep];
            const col = lightColors[i % lightColors.length];
            const tVal = 5.0 + 1.2 * (i / CONFIG.numLights);
            const lightPhase = (i * 0.618 * TAU) % TAU;

            for (let bp = 0; bp < bulbSphere.length; bp++) {
              const b = bulbSphere[bp];
              cloud.add(
                tp[0] + b[0] * bulbRadius,
                tp[1] + b[1] * bulbRadius,
                tp[2] + b[2] * bulbRadius,
                0,
                1,
                0,
                col[0],
                col[1],
                col[2],
                KIND.LIGHT,
                tVal,
                lightPhase,
                1.3,
              );
            }
          }

          for (let k = 0; k < 10; k++) {
            const ang = (k * Math.PI) / 5 + Math.PI / 2;
            const rad = k % 2 === 0 ? 0.15 : 0.06;
            for (let rStep = 0; rStep <= rad; rStep += 0.01) {
              for (let zOff = -0.02; zOff <= 0.02; zOff += 0.012) {
                cloud.add(
                  rStep * Math.cos(ang),
                  Y1 + 0.09 + rStep * Math.sin(ang),
                  zOff,
                  0,
                  0,
                  1,
                  1.38,
                  0.95,
                  0.85,
                  KIND.STAR_CORE,
                  5.4,
                  0,
                  1.4,
                );
              }
            }
          }
          for (let r = 0.04; r <= 0.38; r += 0.02) {
            cloud.add(
              0,
              Y1 + 0.09 + r,
              0,
              0,
              0,
              1,
              1.38,
              0.95,
              0.85,
              KIND.STAR_RAY,
              5.5,
              0,
              1.3,
            );
            cloud.add(
              0,
              Y1 + 0.09 - r,
              0,
              0,
              0,
              1,
              1.38,
              0.95,
              0.85,
              KIND.STAR_RAY,
              5.5,
              0,
              1.3,
            );
            cloud.add(
              r,
              Y1 + 0.09,
              0,
              0,
              0,
              1,
              1.38,
              0.95,
              0.85,
              KIND.STAR_RAY,
              5.5,
              0,
              1.3,
            );
            cloud.add(
              -r,
              Y1 + 0.09,
              0,
              0,
              0,
              1,
              1.38,
              0.95,
              0.85,
              KIND.STAR_RAY,
              5.5,
              0,
              1.3,
            );
            cloud.add(
              r * 0.7,
              Y1 + 0.09 + r * 0.7,
              0,
              0,
              0,
              1,
              1.38,
              0.95,
              0.85,
              KIND.STAR_RAY,
              5.5,
              0,
              1.3,
            );
            cloud.add(
              -r * 0.7,
              Y1 + 0.09 - r * 0.7,
              0,
              0,
              0,
              1,
              1.38,
              0.95,
              0.85,
              KIND.STAR_RAY,
              5.5,
              0,
              1.3,
            );
          }

          for (let ir = 0; ir < 110; ir++) {
            const r = 0.02 + (ir / 109) * 3.1;
            const ringProgress = ir / 109;

            for (let ia = 0; ia < 240; ia++) {
              const a = (ia / 240) * TAU;
              const gx = r * Math.cos(a);
              const gz = r * Math.sin(a);

              const mound = r < 0.7 ? 0.075 * Math.pow(1 - r / 0.7, 1.8) : 0;
              const noiseVal = snowNoise(gx, gz);
              const groundY = -0.04 + mound + noiseVal;
              const groundT0 = ringProgress * 0.35;
              const shade =
                0.82 + (noiseVal > 0 ? 0.18 : 0.05) + Math.random() * 0.08;

              cloud.add(
                gx,
                groundY,
                gz,
                0,
                1,
                0,
                0.88 * shade,
                0.82 * shade,
                0.88 * shade,
                KIND.GROUND,
                groundT0,
              );
            }
          }

          const gifts = [
            {
              type: "cylinder",
              pos: [-0.35, 0.02, 0.85],
              size: [0.32, 0.28],
              box: [1.2, 0.4, 0.5],
              rib: [1.35, 0.4, 0.5],
              rot: 0.0,
              spawnT: 4.7,
            },
            {
              type: "cylinder",
              pos: [0.15, 0.02, 0.92],
              size: [0.28, 0.24],
              box: [1.25, 0.38, 0.48],
              rib: [1.4, 0.45, 0.52],
              rot: 0.0,
              spawnT: 4.8,
            },
            {
              type: "box",
              pos: [0.92, 0.01, 0.35],
              size: [0.42, 0.2, 0.3],
              box: [0.85, 0.82, 0.92],
              rib: [1.38, 1.12, 0.72],
              rot: 0.6,
              spawnT: 4.9,
            },
            {
              type: "box",
              pos: [-0.75, 0.01, -0.65],
              size: [0.3, 0.24, 0.3],
              box: [0.98, 0.8, 0.88],
              rib: [1.38, 0.85, 0.98],
              rot: 0.5,
              spawnT: 5.0,
            },
            {
              type: "box",
              pos: [0.7, 0.01, -0.78],
              size: [0.28, 0.22, 0.28],
              box: [0.9, 0.8, 0.92],
              rib: [1.38, 1.08, 0.72],
              rot: 0.2,
              spawnT: 5.1,
            },
            {
              type: "box",
              pos: [-0.4, 0.02, -0.9],
              size: [0.32, 0.26, 0.32],
              box: [0.88, 0.92, 0.85],
              rib: [1.4, 0.78, 0.92],
              rot: -0.5,
              spawnT: 5.2,
            },
            {
              type: "box",
              pos: [1.05, 0.02, -0.25],
              size: [0.26, 0.2, 0.26],
              box: [1.1, 0.5, 0.6],
              rib: [1.4, 1.15, 0.8],
              rot: 0.8,
              spawnT: 5.3,
            },
            {
              type: "box",
              pos: [-1.02, 0.01, -0.15],
              size: [0.28, 0.22, 0.28],
              box: [0.95, 0.82, 0.9],
              rib: [1.38, 0.95, 0.85],
              rot: -0.3,
              spawnT: 5.4,
            },
            {
              type: "box",
              pos: [-1.25, 0.01, 0.35],
              size: [0.3, 0.26, 0.3],
              box: [1.1, 0.7, 0.8],
              rib: [1.38, 1.1, 0.72],
              rot: 0.4,
              spawnT: 4.4,
            },
            {
              type: "box",
              pos: [-1.25, 0.01, 0.35],
              size: [0.2, 0.18, 0.2],
              lift: 0.26,
              box: [0.8, 0.9, 1.1],
              rib: [1.4, 0.5, 0.6],
              rot: -0.3,
              spawnT: 4.5,
            },
            {
              type: "box",
              pos: [-0.62, 0.01, 1.2],

            else if (rType < 0.88) type = 2;
            else type = 3;

            const speed =
              (0.24 + Math.random() * 0.44) *
              (type === 0 ? 0.72 : type === 3 ? 1.25 : 1.0);
            const swayAmp = 0.03 + Math.random() * 0.08;
            const swayFreq = 1.1 + Math.random() * 1.8;
            const swayPhase = Math.random() * TAU;

            const twinkleFreq = 1.5 + Math.random() * 3.5;
            const twinklePhase = Math.random() * TAU;

            const tintType = Math.random();
            const colorBase =
              tintType < 0.62
                ? [255, 240, 246]
                : tintType < 0.84
                  ? [235, 242, 255]
                  : [255, 225, 238];

            const clusterStyle = Math.random() < 0.5 ? 0 : 1;

            snowflakes.push({
              wx,
              wy,
              wz,
              type,
              speed,
              swayAmp,
              swayFreq,
              swayPhase,
              twinkleFreq,
              twinklePhase,
              colorBase,
              clusterStyle,
            });
          }
        }
        initSnowflakes();

        const skyStars = Array.from({ length: 300 }, () => ({
          x: Math.random(),
          y: Math.random(),
          size: Math.random() * 1.8 + 0.5,
          speed: Math.random() * 3.5 + 1.0,
          phase: Math.random() * TAU,
        }));

        let scene = buildTreeScene();
        let isPlaying = true;
        let simTime = 0.0;
        let lastTimestamp = performance.now();
        const maxFps = CONFIG.maxFps; // FPS cap, default 60
        let zoomScale = 0.9;
        let bloomEnabled = false;
        let snowEnabled = true;

        let cellW, cellH, cols, rows;
        let zBuffer, charBuffer, rBuffer, gBuffer, bBuffer;

        function resizeCanvas() {
          const dpr = window.devicePixelRatio || 1;
          const w = window.innerWidth,
            h = window.innerHeight;
          canvas.width = w * dpr;
          canvas.height = h * dpr;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

          bloomCanvas.width = w * 0.5;
          bloomCanvas.height = h * 0.5;
          bloomCtx.setTransform(0.5, 0, 0, 0.5, 0, 0);

          const fontSize = w < 640 ? 5 : 4;
          ctx.font = `500 ${fontSize}px "JetBrains Mono", monospace`;
          bloomCtx.font = `700 ${fontSize}px "JetBrains Mono", monospace`;

          cellW = Math.max(ctx.measureText("M").width, fontSize * 0.58);
          cellH = Math.max(fontSize * 1.12, 5);
          cols = Math.floor(w / cellW);
          rows = Math.floor(h / cellH);

          const len = cols * rows;
          zBuffer = new Float32Array(len);
          charBuffer = new Uint16Array(len);
          rBuffer = new Uint8Array(len);
          gBuffer = new Uint8Array(len);
          bBuffer = new Uint8Array(len);
        }
        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();

        document.getElementById("btnPlayPause").onclick = (e) => {
          isPlaying = !isPlaying;
          e.target.textContent = isPlaying ? "❚❚ Pause" : "▶ Play";
        };
        document.getElementById("btnReplay").onclick = () => {
          simTime = 0.0;
          isPlaying = true;
          mouseYawOffset = 0;
          mousePitchOffset = 0.28;
        };
        document.getElementById("btnInstant").onclick = () => {
          simTime = 19.5;
        };

        const btnBuildColor = document.getElementById("btnBuildColor");
        btnBuildColor.onclick = (e) => {
          currentBuildColorIdx =
            (currentBuildColorIdx + 1) % BUILD_COLORS.length;
          const colMeta = BUILD_COLORS[currentBuildColorIdx];
          btnBuildColor.textContent = `🎨 Build Color: ${colMeta.name}`;
          btnBuildColor.className = `rounded-lg px-2.5 py-1.5 font-medium transition active:scale-95 ${colMeta.labelColor} ${colMeta.bgBtn}`;
        };

        const btnSnow = document.getElementById("btnSnow");
        btnSnow.onclick = () => {
          snowEnabled = !snowEnabled;
          btnSnow.textContent = snowEnabled ? "❄ Snow: ON" : "✧ Snow: OFF";
          btnSnow.className = snowEnabled ? "wx-btn" : "wx-btn wx-off";
        };

        const zoomSlider = document.getElementById("zoomSlider");
        const zoomLabel = document.getElementById("zoomLabel");
        zoomSlider.oninput = (e) => {
          zoomScale = parseFloat(e.target.value);
          zoomLabel.textContent = zoomScale.toFixed(1) + "x";
        };

        window.addEventListener(
          "wheel",
          (e) => {
            if (e.target.closest("#controlPanel, .wx-ui")) return;
            e.preventDefault();
            const delta = e.deltaY < 0 ? 0.08 : -0.08;
            zoomScale = Math.max(0.4, Math.min(2.2, zoomScale + delta));
            zoomSlider.value = zoomScale;
            zoomLabel.textContent = zoomScale.toFixed(1) + "x";
          },
          { passive: false },
        );

        let mouseYawOffset = 0;
        let mousePitchOffset = 0.28;
        let isDragging = false,
          lastX = 0,
          lastY = 0;

        window.onmousedown = (e) => {
          if (!e.target.closest("#controlPanel, .wx-ui")) {
            isDragging = true;
            lastX = e.clientX;
            lastY = e.clientY;
          }
        };
        window.onmousemove = (e) => {
          if (!isDragging) return;
          mouseYawOffset += (e.clientX - lastX) * 0.007;
          mousePitchOffset = Math.max(
            -0.26,
            Math.min(0.48, mousePitchOffset - (e.clientY - lastY) * 0.005),
          );
          lastX = e.clientX;
          lastY = e.clientY;
        };
        window.onmouseup = () => (isDragging = false);

        let pinchDist = 0;
        const touchDist = (t) =>
          Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
        const setZoom = (z) => {
          zoomScale = Math.max(0.4, Math.min(2.2, z));
          zoomSlider.value = zoomScale;
          zoomLabel.textContent = zoomScale.toFixed(1) + "x";
        };
        window.addEventListener(
          "touchstart",
          (e) => {
            if (e.target.closest("#controlPanel, .wx-ui")) return;
            if (e.touches.length === 1) {
              isDragging = true;
              lastX = e.touches[0].clientX;
              lastY = e.touches[0].clientY;
            } else if (e.touches.length === 2) {
              isDragging = false;
              pinchDist = touchDist(e.touches);
            }
          },
          { passive: true },
        );
        window.addEventListener(
          "touchmove",
          (e) => {
            if (e.target.closest("#controlPanel, .wx-ui")) return;
            if (e.touches.length === 2 && pinchDist > 0) {
              const d = touchDist(e.touches);
              setZoom(zoomScale * (d / pinchDist));
              pinchDist = d;
              return;
            }
            if (!isDragging || e.touches.length !== 1) return;
            mouseYawOffset += (e.touches[0].clientX - lastX) * 0.007;
            mousePitchOffset = Math.max(
              -0.26,
              Math.min(
                0.48,
                mousePitchOffset - (e.touches[0].clientY - lastY) * 0.005,
              ),
            );
            lastX = e.touches[0].clientX;
            lastY = e.touches[0].clientY;
          },
          { passive: true },
        );
        const endTouch = (e) => {
          isDragging = false;
          if (e.touches.length < 2) pinchDist = 0;
        };
        window.addEventListener("touchend", endTouch, { passive: true });
        window.addEventListener("touchcancel", endTouch, { passive: true });

        const easeOutBounce = (u) => {
          const n1 = 7.5625,
            d1 = 2.75;
          if (u < 1 / d1) return n1 * u * u;
          else if (u < 2 / d1) return n1 * (u -= 1.5 / d1) * u + 0.75;
          else if (u < 2.5 / d1) return n1 * (u -= 2.25 / d1) * u + 0.9375;
          else return n1 * (u -= 2.625 / d1) * u + 0.984375;
        };

        function frame(timestamp) {
          if (maxFps > 0 && timestamp - lastTimestamp < 1000 / maxFps - 1) {
            requestAnimationFrame(frame); // too early: skip this frame
            return;
          }
          const dt = Math.min(0.05, (timestamp - lastTimestamp) / 1000);
          lastTimestamp = timestamp;
          if (isPlaying) {
            simTime += dt;
          }

          const w = window.innerWidth,
            h = window.innerHeight;
          ctx.fillStyle = "#090b10";
          ctx.fillRect(0, 0, w, h);

          ctx.fillStyle = "#b4c0d4";
          for (const st of skyStars) {
            const alpha = 0.25 + 0.35 * Math.sin(simTime * st.speed + st.phase);
            ctx.globalAlpha = Math.max(0.1, alpha);
            ctx.fillRect(st.x * w, st.y * h, st.size, st.size);
          }

          ctx.globalAlpha = 1.0;

          zBuffer.fill(1e9);
          charBuffer.fill(0);

          const yaw = simTime * 0.65 + mouseYawOffset;
          const pitch = mousePitchOffset;

          const cy = Math.cos(yaw),
            sy = Math.sin(yaw);
          const cp = Math.cos(pitch),
            sp = Math.sin(pitch);

          const aspect = cellH / cellW;
          const fovScale = rows * 0.65 * zoomScale;

          const { x, y, z, nx, ny, nz, r, g, b, kind, t0, phase, shine } =
            scene;
          let activeLights = 0;
          let activeLetters = 0;

          const sweepFront = simTime * CONFIG.buildSpeed;
          const activeBuildColor = BUILD_COLORS[currentBuildColorIdx];

          for (let i = 0; i < x.length; i++) {
            const creationTime = t0[i];
            if (creationTime > simTime) continue;
            const k = kind[i];
            if (k === KIND.LIGHT) activeLights++;

            let px = x[i],
              py = y[i],
              pz = z[i];
            let cr = r[i],
              cg = g[i],
              cb = b[i];
            let giftGlitch = false;
            let buildWhite = 0;
            let garlandGlow = 0;

            const ageFromSpawn = simTime - creationTime;
            const distToWaveFront =
              sweepFront - (py + (k === KIND.GROUND ? 0.04 : 0));
            if (distToWaveFront >= 0 && distToWaveFront < 0.65) {
              const waveIntensity = 1.0 - distToWaveFront / 0.65;
              buildWhite = waveIntensity * 0.95;
            } else if (ageFromSpawn < 0.45) {
              buildWhite = (1.0 - ageFromSpawn / 0.45) * 0.7;
            }

            if (k === KIND.GIFT) {
              const age = simTime - creationTime;
              if (age < 0.6) py += (1.0 - easeOutBounce(age / 0.6)) * 1.5;
              if (age < 0.8) {
                const prog = 1.0 - age / 0.8;
                if (Math.random() < 0.4 * prog) {
                  px += (Math.random() - 0.5) * 0.1;
                  giftGlitch = true;
                }
              }
            } else if (k === KIND.STAR_CORE || k === KIND.STAR_RAY) {
              // Star intro: drops in with a coin-flip spin, overshoots,
              // settles; rays burst out right after. Then it stays as-is.
              const SC = Y1 + 0.09;
              const delay = k === KIND.STAR_RAY ? 0.35 : 0;
              const dur = k === KIND.STAR_RAY ? 0.9 : 1.3;
              const p = Math.max(0, Math.min(1, (ageFromSpawn - delay) / dur));
              if (p < 1) {
                const c1 = 1.70158,
                  c3 = c1 + 1;
                const eb =
                  1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2);
                const ec = 1 - Math.pow(1 - p, 3);
                const spin = k === KIND.STAR_CORE ? (1 - ec) * TAU * 1.5 : 0;
                const cs = Math.cos(spin),
                  ss = Math.sin(spin);
                const dx = px,
                  dy = py - SC,
                  dz = pz;
                px = (dx * cs + dz * ss) * eb;
                pz = (-dx * ss + dz * cs) * eb;
                py = SC + dy * eb + (1 - ec) * 0.7;
                buildWhite = Math.max(buildWhite, (1 - p) * 0.9);
              }
            } else if (k !== KIND.GROUND && k !== KIND.GARLAND) {
              const age = Math.min(1.0, ageFromSpawn / 0.8);
              if (age < 1.0) {
                const expand = 0.15 + 0.85 * (1 - Math.pow(1 - age, 3));
                px *= expand;
                pz *= expand;
              }
            }

            if (k === KIND.GARLAND) {
              const age = simTime - creationTime;
              if (age < 0.5) garlandGlow = 1.0 - age / 0.5;
            }

            py -= 0.12;

            const x1 = px * cy + pz * sy;
            const y1 = py;
            const z1 = -px * sy + pz * cy;

            const rx = x1;
            const ry = y1 * cp - z1 * sp;
            const rz = y1 * sp + z1 * cp;

            const camDist = 3.6;
            const zz = camDist - rz;
            if (zz <= 0.35) continue;

            const sx = Math.floor(cols / 2 + (rx / zz) * fovScale * aspect);
            const syCoord = Math.floor(
              rows * 0.76 - ((ry - 0.1) / zz) * fovScale,
            );

            if (sx < 0 || sx >= cols || syCoord < 0 || syCoord >= rows)
              continue;

            const idx = syCoord * cols + sx;
            if (zz >= zBuffer[idx]) continue;
            zBuffer[idx] = zz;

            const nx1 = nx[i] * cy + nz[i] * sy;
            const ny1 = ny[i];
            const nz1 = -nx[i] * sy + nz[i] * cy;
            const rnx = nx1;
            const rny = ny1 * cp - nz1 * sp;

            let diff = Math.max(0.15, rnx * 0.5 + rny * 0.7);

            const heightFactor = Math.max(
              0.2,
              Math.min(1.0, (py - Y0) / (Y1 - Y0)),
            );
            if (k === KIND.GROUND) {
              const distFromCenter = Math.hypot(px, pz);
              const shadowFactor = Math.max(
                0.2,
                Math.min(1.0, distFromCenter * 0.8),
              );
              diff *= shadowFactor;
            } else if (k === KIND.NEEDLE || k === KIND.TRUNK) {
              diff *= 0.45 + 0.55 * heightFactor;
            } else if (
              k === KIND.BALL ||
              k === KIND.GARLAND ||
              k === KIND.BOW
            ) {
              diff *= 0.6 + 0.4 * heightFactor;
            }

            let lum = Math.min(1.0, diff + shine[i] * 0.45);

            if (buildWhite > 0) {
              cr = cr * (1 - buildWhite) + activeBuildColor.r * buildWhite;
              cg = cg * (1 - buildWhite) + activeBuildColor.g * buildWhite;
              cb = cb * (1 - buildWhite) + activeBuildColor.b * buildWhite;
              lum = Math.min(1.0, lum + buildWhite * 1.4);
            }
            if (garlandGlow > 0) {
              cr = cr * (1 - garlandGlow) + 1.2 * garlandGlow;
              cg = cg * (1 - garlandGlow) + 1.1 * garlandGlow;
              cb = cb * (1 - garlandGlow) + 0.7 * garlandGlow;
              lum += garlandGlow;
            }
            if (giftGlitch) {
              cr = 1.2;
              cg = 1.2;
              cb = 1.2;
              lum = 1.0;
            }
            if (
              k === KIND.LIGHT ||
              k === KIND.STAR_CORE ||
              k === KIND.STAR_RAY ||
              k === KIND.BELL ||
              k === KIND.GARLAND
            ) {
              cr *= 1.8;
              cg *= 1.8;
              cb *= 1.6;
              lum = 1.0;
            } else if (k === KIND.BALL || k === KIND.BOW) {
              cr *= 1.3;
              cg *= 1.3;
              cb *= 1.3;
            }

            let chCode;
            if (giftGlitch) {
              chCode = 35;
            } else if (k === KIND.NEEDLE) {
              const NEEDLE_RAMP = "=+#%@%#@&8";
              const nIdx = Math.max(
                0,
                Math.min(
                  NEEDLE_RAMP.length - 1,
                  Math.floor(lum * NEEDLE_RAMP.length),
                ),
              );
              chCode = NEEDLE_RAMP.charCodeAt(nIdx);
            } else if (k === KIND.BALL) {
              const BALL_RAMP = "oO8#%@";
              const bIdx = Math.max(
                0,
                Math.min(
                  BALL_RAMP.length - 1,
                  Math.floor(lum * BALL_RAMP.length),
                ),
              );
              chCode = BALL_RAMP.charCodeAt(bIdx);
            } else if (k === KIND.BOW) {
              const BOW_RAMP = "X*~#@";
              const bwIdx = Math.max(
                0,
                Math.min(
                  BOW_RAMP.length - 1,
                  Math.floor(lum * BOW_RAMP.length),
                ),
              );
              chCode = BOW_RAMP.charCodeAt(bwIdx);
            } else if (k === KIND.LIGHT) {
              const LIGHT_RAMP = "*+*✦*";
              const lIdx = Math.max(
                0,
                Math.min(
                  LIGHT_RAMP.length - 1,
                  Math.floor(lum * LIGHT_RAMP.length),
                ),
              );
              chCode = LIGHT_RAMP.charCodeAt(lIdx);
            } else if (k === KIND.GARLAND) {
              const GARLAND_RAMP = "*#%#*@#%";
              const gIdx = Math.max(
                0,
                Math.min(
                  GARLAND_RAMP.length - 1,
                  Math.floor(lum * GARLAND_RAMP.length),
                ),
              );
              chCode = GARLAND_RAMP.charCodeAt(gIdx);
            } else if (k === KIND.TRUNK) {
              const TRUNK_RAMP = "#%HMW8@";
              const tIdx = Math.max(
                0,
                Math.min(
                  TRUNK_RAMP.length - 1,
                  Math.floor(lum * TRUNK_RAMP.length),
                ),
              );
              chCode = TRUNK_RAMP.charCodeAt(tIdx);
            } else if (k === KIND.SNOWCAP) {
              const SNOW_RAMP = "·:+*";
              const sIdx = Math.max(
                0,
                Math.min(
                  SNOW_RAMP.length - 1,
                  Math.floor(lum * SNOW_RAMP.length),
                ),
              );
              chCode = SNOW_RAMP.charCodeAt(sIdx);
            } else if (k === KIND.GROUND) {
              const GROUND_RAMP = " .:-=+*";
              const gIdx = Math.max(
                1,
                Math.min(
                  GROUND_RAMP.length - 1,
                  Math.floor(lum * (GROUND_RAMP.length - 1)),
                ),
              );
              chCode = GROUND_RAMP.charCodeAt(gIdx);
            } else {
              const rampIdx = Math.max(
                1,
                Math.min(
                  CHAR_RAMP.length - 1,
                  Math.floor(lum * (CHAR_RAMP.length - 1)),
                ),
              );
              chCode = CHAR_RAMP.charCodeAt(rampIdx);
            }

            charBuffer[idx] = chCode;
            rBuffer[idx] = Math.min(255, cr * 255);
            gBuffer[idx] = Math.min(255, cg * 255);
            bBuffer[idx] = Math.min(255, cb * 255);
          }

          if (snowEnabled) {
            const windX =
              Math.sin(simTime * 0.4) * 0.09 + Math.cos(simTime * 0.16) * 0.04;
            const windZ = Math.cos(simTime * 0.32) * 0.07;

            const sCy = Math.cos(mouseYawOffset),
              sSy = Math.sin(mouseYawOffset);
            const sCp = Math.cos(mousePitchOffset),
              sSp = Math.sin(mousePitchOffset);

            for (let i = 0; i < snowflakes.length; i++) {
              const flake = snowflakes[i];

              if (isPlaying) {
                flake.wy -= flake.speed * dt;
                flake.wx += windX * 0.25 * dt;
                flake.wz += windZ * 0.25 * dt;

                if (flake.wy < -0.25) {
                  flake.wy = 3.5 + Math.random() * 0.4;
                  flake.wx = (Math.random() - 0.5) * 8.2;
                  flake.wz = (Math.random() - 0.5) * 8.2;
                }
                if (flake.wx > 4.2) flake.wx = -4.2;
                else if (flake.wx < -4.2) flake.wx = 4.2;
                if (flake.wz > 4.2) flake.wz = -4.2;
                else if (flake.wz < -4.2) flake.wz = 4.2;
              }

              const swayX =
                Math.sin(simTime * flake.swayFreq + flake.swayPhase) *
                  flake.swayAmp +
                windX;
              const swayZ =
                Math.cos(simTime * (flake.swayFreq * 0.85) + flake.swayPhase) *
                  flake.swayAmp +
                windZ;

              const curX = flake.wx + swayX;
              const curY = flake.wy;
              const curZ = flake.wz + swayZ;

              const x1 = curX * sCy + curZ * sSy;
              const y1 = curY - 0.12;
              const z1 = -curX * sSy + curZ * sCy;

              const rx = x1;
              const ry = y1 * sCp - z1 * sSp;
              const rz = y1 * sSp + z1 * sCp;

              const camDist = 3.6;
              const zz = camDist - rz;
              if (zz <= 0.35) continue;

              const sx = Math.floor(cols / 2 + (rx / zz) * fovScale * aspect);
              const sy = Math.floor(rows * 0.76 - ((ry - 0.1) / zz) * fovScale);

              if (sx < 0 || sx >= cols || sy < 0 || sy >= rows) continue;

              const tw =
                0.75 +
                0.25 *
                  Math.sin(simTime * flake.twinkleFreq + flake.twinklePhase);
              let cr = Math.min(255, Math.floor(flake.colorBase[0] * tw));
              let cg = Math.min(255, Math.floor(flake.colorBase[1] * tw));
              let cb = Math.min(255, Math.floor(flake.colorBase[2] * tw));

              let charCode = 42;
              if (flake.type === 0) {
                charCode = zz > 4.4 ? 46 : 183;
                const distFade = Math.max(0.4, Math.min(1.0, 3.8 / zz));
                cr = Math.floor(cr * distFade);
                cg = Math.floor(cg * distFade);
                cb = Math.floor(cb * distFade);
              } else if (flake.type === 1) {
                charCode =
                  zz > 3.8
                    ? 43
                    : zz > 2.7
                      ? 42
                      : flake.swayPhase > Math.PI
                        ? 120
                        : 111;
              } else if (flake.type === 2) {
                charCode =
                  zz > 3.2 ? 10052 : flake.swayPhase > Math.PI ? 10053 : 10024;
              }

              if (flake.type === 3 && zz < 3.0) {
                const idx = sy * cols + sx;
                if (zz < zBuffer[idx]) {
                  zBuffer[idx] = zz;
                  charBuffer[idx] = 10052;
                  rBuffer[idx] = cr;
                  gBuffer[idx] = cg;
                  bBuffer[idx] = cb;
                }

                const armR = Math.floor(cr * 0.85);
                const armG = Math.floor(cg * 0.9);
                const armB = Math.floor(cb * 0.95);
                const armZz = zz + 0.01;
                const hChar = flake.clusterStyle === 0 ? 45 : 183;
                const vChar = flake.clusterStyle === 0 ? 124 : 183;

                if (sy > 0) {
                  const tIdx = (sy - 1) * cols + sx;
                  if (armZz < zBuffer[tIdx]) {
                    zBuffer[tIdx] = armZz;
                    charBuffer[tIdx] = vChar;
                    rBuffer[tIdx] = armR;
                    gBuffer[tIdx] = armG;
                    bBuffer[tIdx] = armB;
                  }
                }
                if (sy < rows - 1) {
                  const bIdx = (sy + 1) * cols + sx;
                  if (armZz < zBuffer[bIdx]) {
                    zBuffer[bIdx] = armZz;
                    charBuffer[bIdx] = vChar;
                    rBuffer[bIdx] = armR;
                    gBuffer[bIdx] = armG;
                    bBuffer[bIdx] = armB;
                  }
                }
                if (sx > 0) {
                  const lIdx = sy * cols + (sx - 1);
                  if (armZz < zBuffer[lIdx]) {
                    zBuffer[lIdx] = armZz;
                    charBuffer[lIdx] = hChar;
                    rBuffer[lIdx] = armR;
                    gBuffer[lIdx] = armG;
                    bBuffer[lIdx] = armB;
                  }
                }
                if (sx < cols - 1) {

              0,

              h,

            ctx.globalCompositeOperation = "source-over";

          requestAnimationFrame(frame);

          lastTimestamp = ts;
          requestAnimationFrame(frame);
        });

              t: "leaf",
              id: nid(),
              x: q[0],
              y: q[1],

            td = o.d0 + dur * 0.8,
            tl = layerAt(segs, 1);
          if (tip === "rose") {

            this.style.height = this.scrollHeight + "px";
          });
        }

        /* ---------- Custom Confirm Modal Helper ---------- */
        function showConfirm(message, title = "Confirmation") {
          return new Promise((resolve) => {
            const modal = $("wxConfirmModal");
            $("wxConfirmTitle").textContent = title;
            $("wxConfirmMessage").textContent = message;
            modal.hidden = false;

            const okBtn = $("wxConfirmOk");
            const cancelBtn = $("wxConfirmCancel");

            const cleanup = () => {
              modal.hidden = true;
              okBtn.onclick = null;
              cancelBtn.onclick = null;
              modal.onclick = null;
            };

            okBtn.onclick = () => {
              cleanup();
              resolve(true);
            };
            cancelBtn.onclick = () => {
              cleanup();
              resolve(false);
            };
            modal.onclick = (e) => {
              if (e.target === modal) {
                cleanup();
                resolve(false);
              }
            };
          });
        }

        /* ---------- API ---------- */
        const demoData = [
          "Liam",
          "Sophia",
          "Noah",
          "Emma",
          "Oliver",
          "Ava",
        ].map((n, i) => ({
          id: "d" + i,
          name: n,
          icon: ["i01", "i02", "i03", "i04", "i05", "i06"][i],
          message:
            "Wishing you a very warm and cozy Christmas! (sample letter from " +
            n +
            ")",
          created_at: new Date(Date.now() - i * 3600e3).toISOString(),
        }));
        const demo = {
          list_wish_names: () =>
            demoData.map((w) => ({ id: w.id, name: w.name, icon: w.icon })),
          send_wish: (a) => {
            demoData.push({
              id: "d" + Date.now(),
              name: a.p_name,
              icon: a.p_icon,
              message: a.p_message,
              created_at: new Date().toISOString(),
            });
          },
          admin_list_wishes: (a) => {
            if (a.p_password !== "demo") throw new Error("Incorrect password");
            return demoData.slice().reverse();
          },
          admin_delete_wish: (a) => {
            if (a.p_password !== "demo") throw new Error("Incorrect password");
            const i = demoData.findIndex((w) => w.id === a.p_id);
            if (i >= 0) demoData.splice(i, 1);
          },
        };
        async function rpc(fn, args) {
          if (DEMO) return demo[fn](args || {});
          const r = await fetch(CFG.SUPABASE_URL + "/rest/v1/rpc/" + fn, {
            method: "POST",
            headers: {
              apikey: CFG.SUPABASE_KEY,
              "Content-Type": "application/json",
            },
            body: JSON.stringify(args || {}),
          });
          const t = await r.text();
          let data = null;
          try {
            data = t ? JSON.parse(t) : null;
          } catch (e) {
            data = t;
          }
          if (!r.ok)
            throw new Error((data && data.message) || "An error occurred");
          return data;
        }

        /* ---------- Falling Letters ---------- */
        // 40 icons: put images in ./img/icons/01.png ... 40.png (png/jpg/jpeg/webp all work)
        // Edit the 2nd value of each row to change the name shown under the big icon.
        const ICON_DIR = "./img/icons/";
        const ICON_EXTS = ["png", "jpg", "jpeg", "webp"];
        const ICONS = [
          ["i01", "Icon 1", "01"],
          ["i02", "Icon 2", "02"],
          ["i03", "Icon 3", "03"],
          ["i04", "Icon 4", "04"],
          ["i05", "Icon 5", "05"],
          ["i06", "Icon 6", "06"],
          ["i07", "Icon 7", "07"],
          ["i08", "Icon 8", "08"],
          ["i09", "Icon 9", "09"],
          ["i10", "Icon 10", "10"],
          ["i11", "Icon 11", "11"],
          ["i12", "Icon 12", "12"],
          ["i13", "Icon 13", "13"],
          ["i14", "Icon 14", "14"],
          ["i15", "Icon 15", "15"],
          ["i16", "Icon 16", "16"],
          ["i17", "Icon 17", "17"],
          ["i18", "Icon 18", "18"],
          ["i19", "Icon 19", "19"],
          ["i20", "Icon 20", "20"],
          ["i21", "Icon 21", "21"],
          ["i22", "Icon 22", "22"],
          ["i23", "Icon 23", "23"],
          ["i24", "Icon 24", "24"],
          ["i25", "Icon 25", "25"],
          ["i26", "Icon 26", "26"],
          ["i27", "Icon 27", "27"],
          ["i28", "Icon 28", "28"],
          ["i29", "Icon 29", "29"],
          ["i30", "Icon 30", "30"],
          ["i31", "Icon 31", "31"],
          ["i32", "Icon 32", "32"],
          ["i33", "Icon 33", "33"],
          ["i34", "Icon 34", "34"],
          ["i35", "Icon 35", "35"],
          ["i36", "Icon 36", "36"],
          ["i37", "Icon 37", "37"],
          ["i38", "Icon 38", "38"],
          ["i39", "Icon 39", "39"],
          ["i40", "Icon 40", "40"],
        ];
        const DEFAULT_ICON = "i01";
        // Show icon as image; old emoji values already stored in DB still render as text
        function setIcon(el, key) {
          el.textContent = "";
          const f = ICONS.find((i) => i[0] === key);
          if (f) {
            const img = new Image();
            let n = 0;
            img.onerror = () => {
              n++;
              if (n < ICON_EXTS.length)
                img.src = ICON_DIR + f[2] + "." + ICON_EXTS[n];
            };
            img.src = ICON_DIR + f[2] + "." + ICON_EXTS[0];
            img.alt = f[1];
            img.draggable = false;
            el.appendChild(img);
          } else {
            el.textContent = key || "";
          }
        }
        const layer = document.createElement("div");
        layer.className = "wx-layer";
        document.body.appendChild(layer);

        let names = [];
        let queue = [];
        let showLetters = true;
        let active = 0;

        /* ---------- Admin: click a falling letter to read it ---------- */
        let isAdmin = false;
        let adminMsgs = new Map();
        const canRead = () => isAdmin && location.hash === "#admin";
        const readModal = $("wxRead");
        function closeRead() {
          readModal.hidden = true;
          layer.classList.remove("wx-paused");
        }
        function showLetter(w) {
          setIcon($("wxReadIcon"), w.icon || DEFAULT_ICON);
          $("wxReadName").textContent = w.name;
          $("wxReadTime").textContent = w.created_at
            ? new Date(w.created_at).toLocaleString("en-US")
            : "";
          $("wxReadMsg").textContent = w.message;
          readModal.hidden = false;
          readModal.scrollTop = 0;
          $("wxReadMsg").scrollTop = 0;
          layer.classList.add("wx-paused");
        }
        async function openLetter(item) {
          if (!canRead() || !item || !item.id) return;
          let w = adminMsgs.get(item.id);
          if (!w) {
            try {
              await fetchAdmin();
            } catch (e) {
              isAdmin = false;
              refreshClickable();
              return;
            }
            w = adminMsgs.get(item.id);
          }
          if (w) showLetter(w);
        }
        function applyClickable(el) {
          el.classList.toggle(
            "wx-clickable",
            !!(canRead() && el._item && el._item.id),
          );
        }
        function refreshClickable() {
          layer.querySelectorAll(".wx-fall").forEach(applyClickable);
        }

        function nextItem() {
          if (!queue.length)
            queue = names.slice().sort(() => Math.random() - 0.5);
          return queue.pop();
        }
        function spawn(item, mine) {
          if (!showLetters || !item || active >= 14) return;
          const el = document.createElement("div");
          el.className = "wx-fall" + (mine ? " wx-mine" : "");
          el._item = item;
          el.style.left = 4 + Math.random() * 86 + "%";
          el.style.animationDuration = 13 + Math.random() * 7 + "s";
          const sway = document.createElement("div");
          sway.className = "wx-sway";
          sway.style.animationDuration = 2.4 + Math.random() * 2 + "s";
          sway.style.animationDelay = -Math.random() * 3 + "s";
          const ico = document.createElement("span");
          ico.className = "wx-ico";
          setIcon(ico, item.icon || DEFAULT_ICON);
          const label = document.createElement("span");
          label.className = "wx-name";
          label.textContent = item.name;
          sway.append(ico, label);
          el.appendChild(sway);
          layer.appendChild(el);
          active++;
          applyClickable(el);
          const stop = (e) => {
            if (el.classList.contains("wx-clickable")) e.stopPropagation();
          };
          el.addEventListener("mousedown", stop);
          el.addEventListener("touchstart", stop, { passive: true });
          el.addEventListener("click", () => openLetter(item));
          el.addEventListener("animationend", (e) => {
            if (e.target === el) {
              el.remove();
              active--;
            }
          });
        }
        setInterval(() => {
          if (showLetters && names.length) spawn(nextItem(), false);
        }, 1700);

        async function refreshNames() {
          try {
            const rows = await rpc("list_wish_names");
            names = (rows || []).map((r) => ({
              id: r.id,
              name: r.name,
              icon: r.icon,
            }));
          } catch (e) {}
        }
        refreshNames();
        setInterval(refreshNames, 45000);

        $("wxToggle").onclick = () => {
          showLetters = !showLetters;
          $("wxToggle").textContent = showLetters
            ? "✉ Letters: ON"
            : "✧ Letters: OFF";
          $("wxToggle").className = showLetters ? "wx-btn" : "wx-btn wx-off";
          if (!showLetters) {
            layer.innerHTML = "";
            active = 0;
          }
        };

        /* ---------- Wish Wizard (3 steps) ---------- */
        const wiz = $("wxWiz");
        const status = $("wxStatus");
        const st = { msg: "", name: "", icon: ICONS[0] };
        let step = 1;
        function setStatus(el, msg, err) {
          el.textContent = msg || "";
          el.className = "wx-status" + (err ? " err" : "");
        }
        function showStep(n) {
          step = n;
          ["wxS1", "wxS2", "wxS3"].forEach(
            (id, i) => ($(id).hidden = i + 1 !== n),
          );
          wiz
            .querySelectorAll(".wx-steps i")
            .forEach((b, i) => b.classList.toggle("on", i < n));
          $("wxStepNo").textContent = n + " / 3";
          setStatus(status, "");
          if (n === 3) fillPreview();
          wiz.scrollTop = 0;
        }
        function canNext1() {
          $("wxNext1").disabled = !(
            $("wxMsg").value.trim() &&
            ($("wxAnon").checked || $("wxName").value.trim())
          );
        }
        function syncAnon() {
          const on = $("wxAnon").checked;
          const inp = $("wxName");
          inp.disabled = on;
          inp.placeholder = on ? "Anonymous" : "Your name";
          if (on) inp.value = "";
          else inp.focus();
          canNext1();
        }
        $("wxAnon").onchange = syncAnon;
        function paintIcon() {
          $("wxGrid")
            .querySelectorAll(".wx-tile")
            .forEach((t) =>
              t.classList.toggle(
                "sel",
                t.dataset.i === String(ICONS.indexOf(st.icon)),
              ),
            );
        }
        const ICON_PAGE_SIZE = 20; // 20 icons per page -> 2 pages for 40 icons
        const ICON_PAGES = Math.ceil(ICONS.length / ICON_PAGE_SIZE);
        let iconPage = 0;
        function renderIconPage() {
          const grid = $("wxGrid");
          grid.innerHTML = "";
          const start = iconPage * ICON_PAGE_SIZE;
          ICONS.slice(start, start + ICON_PAGE_SIZE).forEach((ic, k) => {
            const b = document.createElement("button");
            b.type = "button";
            b.className = "wx-tile";
            b.dataset.i = String(start + k);
            setIcon(b, ic[0]);
            b.onclick = () => {
              st.icon = ic;
              paintIcon();
            };
            grid.appendChild(b);
          });
          const dots = $("wxPgDots");
          dots.innerHTML = "";
          for (let p = 0; p < ICON_PAGES; p++) {
            const d = document.createElement("i");
            d.className = p === iconPage ? "on" : "";
            d.onclick = () => gotoIconPage(p);
            dots.appendChild(d);
          }
          $("wxPgPrev").disabled = iconPage === 0;
          $("wxPgNext").disabled = iconPage === ICON_PAGES - 1;
          paintIcon();
        }
        function gotoIconPage(p) {
          iconPage = Math.max(0, Math.min(ICON_PAGES - 1, p));
          renderIconPage();
        }
        $("wxPgPrev").onclick = () => gotoIconPage(iconPage - 1);
        $("wxPgNext").onclick = () => gotoIconPage(iconPage + 1);
        renderIconPage();
        function fillPreview() {
          setIcon($("wxDeco3"), st.icon[0]);
          $("wxPvMsg").textContent = st.msg;
          $("wxPvName").textContent = st.name;
          $("wxPvName2").textContent = st.name;
        }
        function openWiz() {
          $("wxName").value = ""; // "From" always starts empty
          $("wxAnon").checked = false;
          $("wxName").disabled = false;
          $("wxName").placeholder = "Your name";
          canNext1();
          gotoIconPage(
            Math.floor(Math.max(0, ICONS.indexOf(st.icon)) / ICON_PAGE_SIZE),
          );
          showStep(1);
          wiz.hidden = false;
          if (DEMO)
            setStatus(
              status,
              "Preview mode: letter is not saved to the server.",
            );
          setTimeout(
            () => ($("wxMsg").value ? $("wxName") : $("wxMsg")).focus(),
            60,
          );
        }
        function closeWiz() {
          wiz.hidden = true;
        }

        $("wxOpen").onclick = openWiz;
        $("wxClose").onclick = closeWiz;
        $("wxBack").onclick = () =>
          step > 1 ? showStep(step - 1) : closeWiz();
        $("wxMsg").oninput = (e) => {
          $("wxCount").textContent = e.target.value.length;
          canNext1();
        };
        $("wxName").oninput = canNext1;
        $("wxNext1").onclick = () => {
          st.msg = $("wxMsg").value.trim();
          st.name = $("wxAnon").checked
            ? "Anonymous"
            : $("wxName").value.trim();
          if (!st.msg || !st.name) return;
          paintIcon();
          showStep(2);
        };
        $("wxNext2").onclick = () => showStep(3);
        $("wxEdit").onclick = () => showStep(1);
        $("wxSend").onclick = async () => {
          try {
            const last = +localStorage.getItem("wx_last") || 0;
            if (Date.now() - last < 5000)
              return setStatus(
                status,
                "Please wait a few seconds before sending another.",
                true,
              );
          } catch (e) {}
          const btn = $("wxSend");
          btn.disabled = true;
          setStatus(status, "Sending...");
          try {
            await rpc("send_wish", {
              p_name: st.name,
              p_message: st.msg,
              p_icon: st.icon[0],
            });
            try {
              localStorage.setItem("wx_last", String(Date.now()));
            } catch (e) {}
            const mine = { name: st.name, icon: st.icon[0] };
            names.push(mine);
            setStatus(status, "Sent! Your letter will fall onto the tree ✨");
            const G = CFG.GARDEN || {};
            let gardenOn = false;
            if (G.ENABLED !== false && window.TypeGarden) {
              try {
                window.TypeGarden.play({
                  text: G.TEXT || CFG.OWNER,
                  durationSeconds: G.DURATION_SECONDS,
                  fadeSeconds: G.FADE_SECONDS,
                  typeIntervalMs: G.TYPE_INTERVAL_MS,
                  growSpeed: G.GROW_SPEED,
                  // thư rơi xuống cây khi khu vườn bắt đầu mờ đi
                  onFadeOut: () => spawn(mine, true),
                });
                gardenOn = true;
              } catch (err) {
                console.error(err);
              }
            }
            setTimeout(() => {
              closeWiz();
              $("wxMsg").value = "";
              $("wxCount").textContent = "0";
              st.msg = "";
              if (!gardenOn) spawn(mine, true);
            }, 1100);
          } catch (e) {
            setStatus(status, e.message, true);
          } finally {
            btn.disabled = false;
          }
        };

        /* ---------- Admin ---------- */
        const adminModal = $("wxAdmin");
        const aStatus = $("wxAdminStatus");
        let adminPass = "";
        try {
          adminPass = sessionStorage.getItem("wx_pass") || "";
        } catch (e) {}

        function closeAdmin() {
          adminModal.hidden = true;
        }
        async function fetchAdmin() {
          const rows = await rpc("admin_list_wishes", {
            p_password: adminPass,
          });
          adminMsgs = new Map(rows.map((r) => [r.id, r]));
          isAdmin = true;
          try {
            sessionStorage.setItem("wx_pass", adminPass);
          } catch (e) {}
          refreshClickable();
          return rows;
        }
        async function loadAdmin() {
          setStatus(aStatus, "Loading...");
          try {
            const rows = await fetchAdmin();
            $("wxAdminLogin").hidden = true;
            $("wxAdminView").hidden = false;
            $("wxAdminViewHeaderBtns").hidden = false;
            $("wxAdminCount").textContent = "(" + rows.length + ")";
            const list = $("wxList");
            list.innerHTML = "";
            if (!rows.length) {
              const p = document.createElement("p");
              p.className = "wx-hint";
              p.textContent = "No wishes yet.";
              list.appendChild(p);
            }
            rows.forEach((w) => {
              const item = document.createElement("div");
              item.className = "wx-item wx-open";
              item.title = "Click to read in full";
              item.onclick = () => {
                if (String(window.getSelection()).length) return;
                showLetter(w);
              };
              const head = document.createElement("div");
              head.className = "wx-item-head";
              const nm = document.createElement("span");
              nm.className = "wx-item-name";
              const ni = document.createElement("span");
              ni.className = "wx-mini-ico";
              setIcon(ni, w.icon || DEFAULT_ICON);
              nm.append(ni, " " + w.name);
              const tm = document.createElement("span");
              tm.className = "wx-item-time";
              tm.textContent = new Date(w.created_at).toLocaleString("en-US");
              const del = document.createElement("button");
              del.className = "wx-del";
              del.textContent = "Delete";
              del.onclick = async (ev) => {
                ev.stopPropagation();
                const confirmed = await showConfirm(
                  "Delete wish from " + w.name + "?",
                  "Delete Wish",
                );
                if (!confirmed) return;
                try {
                  await rpc("admin_delete_wish", {
                    p_password: adminPass,
                    p_id: w.id,
                  });
                  await loadAdmin();
                  refreshNames();
                } catch (e) {
                  setStatus(aStatus, e.message, true);
                }
              };
              head.append(nm, tm, del);
              const body = document.createElement("div");
              body.className = "wx-item-msg wx-clamp";
              body.textContent = w.message;
              item.append(head, body);
              list.appendChild(item);
            });
            setStatus(aStatus, "");
          } catch (e) {
            adminPass = "";
            isAdmin = false;
            adminMsgs = new Map();
            refreshClickable();
            try {
              sessionStorage.removeItem("wx_pass");
            } catch (e2) {}
            $("wxAdminLogin").hidden = false;
            $("wxAdminView").hidden = true;
            $("wxAdminViewHeaderBtns").hidden = true;
            setStatus(aStatus, e.message, true);
          }
        }
        const syncAdminBtn = () => {
          $("wxAdminBtn").hidden = location.hash !== "#admin";
          refreshClickable();
          if (location.hash === "#admin" && adminPass && !isAdmin)
            fetchAdmin().catch(() => {});
        };
        syncAdminBtn();
        window.addEventListener("hashchange", syncAdminBtn);
        $("wxAdminBtn").onclick = () => {
          adminModal.hidden = false;
          setStatus(aStatus, DEMO ? "Preview mode: password is demo" : "");
          if (adminPass) loadAdmin();
          else {
            $("wxAdminViewHeaderBtns").hidden = true;
            setTimeout(() => $("wxPass").focus(), 50);
          }
        };
        $("wxAdminGo").onclick = () => {
          adminPass = $("wxPass").value;
          $("wxPass").value = "";
          loadAdmin();
        };
        $("wxPass").onkeydown = (e) => {
          if (e.key === "Enter") $("wxAdminGo").click();
        };
        $("wxAdminRefresh").onclick = loadAdmin;
        $("wxAdminClose1").onclick = closeAdmin;
        $("wxAdminClose2").onclick = closeAdmin;
        $("wxReadClose").onclick = closeRead;
        $("wxReadX").onclick = closeRead;
        readModal.onclick = (e) => {
          if (e.target === readModal) closeRead();
        };
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            if (!readModal.hidden) return closeRead();
            if (!$("wxConfirmModal").hidden) {
              $("wxConfirmCancel").click();
              return;
            }
            closeWiz();
            closeAdmin();
          }
        });
      })();
    </script>
    <audio id="bgm" preload="auto"></audio>
    <button
      id="bgmBtn"
      aria-label="Music"
      style="
        position: fixed;
        right: 14px;
        bottom: 14px;
        z-index: 9999;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: 0;
        cursor: pointer;
        background: rgba(0, 0, 0, 0.45);
        color: #fff;
        font-size: 18px;
      "
    >
      🔇
    </button>
    <script>
      (function () {
        const BGM_TRACKS = [
          "./audio/bgm.mp3",
          "./audio/bgm2.mp3",
          "./audio/bgm3.mp3",
        ];
        const a = document.getElementById("bgm"),
          b = document.getElementById("bgmBtn");

        a.volume = 0.5;
        let idx = 0,
          fails = 0,
          want = true,
          unlocked = false;

        const sync = () => {
          b.textContent = a.paused ? "🔇" : "🔊";
        };

        function load(i) {
          idx = (i + BGM_TRACKS.length) % BGM_TRACKS.length;
          a.src = BGM_TRACKS[idx];
          a.load();
        }

        function tryPlay() {
          if (!want) return;
          const playPromise = a.play();
          if (playPromise !== undefined) {
            playPromise
              .then(() => {
                fails = 0;
                unlocked = true;
                sync();
                cleanupUnlockEvents();
              })
              .catch(() => {
                sync();
              });
          }
        }

        function next() {
          load(idx + 1);
          if (want) tryPlay();
        }

        load(0);

        a.addEventListener("ended", next);
        a.addEventListener("error", () => {
          if (++fails < BGM_TRACKS.length) next();
        });
        a.addEventListener("play", sync);
        a.addEventListener("pause", sync);

        b.onclick = (e) => {
          e.stopPropagation();
          if (a.paused) {
            want = true;
            tryPlay();
          } else {
            want = false;
            a.pause();
          }
          sync();
        };

        const EVTS = ["click", "touchend", "keydown", "mousedown"];

        function onFirstInteract(e) {
          if (e.target === b) return;
          if (!unlocked && want) {
            tryPlay();
          }
        }

        function cleanupUnlockEvents() {
          EVTS.forEach((evt) =>
            window.removeEventListener(evt, onFirstInteract, { capture: true }),
          );
        }

        EVTS.forEach((evt) =>
          window.addEventListener(evt, onFirstInteract, {
            capture: true,
            passive: true,
          }),
        );

        tryPlay();
      })();
    </script>
  </body>
