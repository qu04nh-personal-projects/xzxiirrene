<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Irene 隋憶</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Serif+TC:wght@700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none}
#app{position:fixed;inset:0;cursor:text;font-family:'DM Mono',ui-monospace,monospace;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
canvas{position:absolute;inset:0;width:100%;height:100%}
#in{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;border:0;padding:0;font-size:16px;pointer-events:none}
#bar{position:absolute;left:calc(24px + env(safe-area-inset-left));right:calc(24px + env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;font-size:12px;letter-spacing:.04em}
#hints{display:flex;gap:18px;flex-wrap:wrap;opacity:.6}
@media (max-width:600px){#hints{gap:10px;font-size:11px}}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <input id="in" aria-label="Type to grow a garden" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false">
  <div id="bar">
    <div id="hints"><span>type to grow</span><span>space cuts</span><span>backspace withers</span><span>enter clears</span></div>
    
  </div>
</div>
<script>
(() => {
const START = 'Irene 隋憶*•’•€';            // <- the text that grows on load
const F = '"Playfair Display","Noto Serif TC",Georgia,serif';
const PAL = [

const SPEED = 1.8;   // growth speed: 1 = original, higher = faster
let C = {};

const cv = document.getElementById('cv'), g = cv.getContext('2d'), inp = document.getElementById('in');
let W, H, dpr, letters = [], uid = 1, Sd = 0, St = 0, cx = 0, cy = 0, ctx_ = 0, cty = 0, lastKey = 0, mx = null, my = 0, lt = 0, wrapped = false, kd = false;
const cache = {}, PI = Math.PI;
const hs = n => { const x = Math.sin(n) * 43758.5453; return x - Math.floor(x); };

/* ---------- drawing primitives (smooth quadratic through midpoints) ---------- */
function path(p, closed) {

  if (closed) { const s = m(p[n-1], p[0]); g.moveTo(s[0], s[1]); for (let i = 0; i < n; i++) { const q = m(p[i], p[(i+1)%n]); g.quadraticCurveTo(p[i][0], p[i][1], q[0], q[1]); } g.closePath(); }

}
const fillP = (p, col) => { g.beginPath(); path(p, true); g.fillStyle = col; g.fill(); };
const strokeP = (p, col, w) => { g.beginPath(); path(p, false); g.strokeStyle = col; g.lineWidth = w; g.lineCap = g.lineJoin = 'round'; g.stroke(); };
function strokeRange(P, a, b, col, w) {

function vine(base, dir, len, amp, waves, ph, bend, n) {

function curl(P, sign, rad) {

function bez(a, b, c, d, n) { const P = []; for (let i = 0; i <= n; i++) { const t = i/n, u = 1-t; P.push([u*u*u*a[0]+3*u*u*t*b[0]+3*u*t*t*c[0]+t*t*t*d[0], u*u*u*a[1]+3*u*u*t*b[1]+3*u*t*t*c[1]+t*t*t*d[1]]); } return P; }

function rose(x0, y0, R, rot, e, a) {

  });

/* ---------- growth ---------- */

  }

/* ---------- layout: one line if it fits, otherwise wrap by word ---------- */

function resize() { const r = cv.getBoundingClientRect(); if (!r.width) return; W = r.width; H = r.height; dpr = window.devicePixelRatio || 1; cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr); layout(true); }

/* ---------- input ---------- */
function add(ch, now) {

const SENT = '\u200b'; inp.value = SENT;      // phone keyboards: mirror the hidden field
inp.addEventListener('input', () => {

const app = document.getElementById('app');
app.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; if (e.pointerType === 'mouse') inp.focus({ preventScroll:true }); });

window.addEventListener('pointermove', e => { mx = e.clientX; my = e.clientY; });

/* ---------- render ---------- */

  }
  const jit = () => [0, 0, 0];   // no boil / flicker
  const kdf = l => l.dead ? 1 - eo((now - l.dead)/WITHER) : 1;
  function stem(e, l, age, kk, layer, frO) {
    const fr = frO != null ? frO : eo((age - e.d0)/e.dur)*kk; if (fr <= 0) return;
    const j = jit(e.id), P = e.pts.map(p => wpt(S, l, l.x + p[0]*S + j[0], l.y + p[1]*S + j[1], now));
    for (const sg of e.segs) { if (sg.layer !== layer) continue; const b = Math.min(sg.u1, fr); if (b > sg.u0) strokeRange(P, sg.u0, b, C.blue, S*.022*(e.w || 1)); }
  }
  function el(e, l, age, kk) {
    const j = jit(e.id), w = (x, y) => wpt(S, l, l.x + x*S + j[0], l.y + y*S + j[1], now);
    if (e.t === 'leaf') { const sc = spr((age - e.d0)/1000, 7, 15)*kk; if (sc <= 0) return; const p = w(e.x, e.y); leaf(p[0], p[1], e.a + j[2], e.L*S*sc, e.bend, C.blue, C.bg); }
    else { const a = age - e.d0; if (a < 0 || kk <= .001) return; const p = w(e.x, e.y); rose(p[0], p[1], e.R*S*kk, e.rot + j[2] + (l.lean ? l.lean[0]*.2 : 0), e, a); }
  }
  const draw = layer => {
    for (const l of L) {
      if (l.ch === ' ' || !l.els) continue;
      const age = (now - l.birth)*SPEED, kk = kdf(l);
      const each = e => { if (e.t === 'stem') stem(e, l, age, kk, layer); else if (e.layer === layer) el(e, l, age, kk); };
      l.els.forEach(each); if (l.endEls) l.endEls.forEach(each);
      const i = act.indexOf(l), nx = i >= 0 ? act[i+1] : null;
      if (l.tend && (l.dead || !nx || nx.ch === ' ')) {
        let fr = eo(((now - l.tb)*SPEED - 150)/450);
        if (l.cut != null) fr *= 1 - eo((now - l.cut)*SPEED/150)*Math.min(.85, 20/(.6*S));
        for (const e of l.tend) stem(e, l, age, kk, layer, fr*kk);
      }
    }
  };
  draw(0);
  for (const l of L) if (l.ch !== ' ' && !l.dead) { g.font = `700 ${S}px ${F}`; g.textAlign = 'center'; g.textBaseline = 'alphabetic'; g.fillStyle = C.text; g.fillText(l.ch, l.x, l.y); }
  draw(1);
  if (caret && (now - lastKey < 500 || Math.floor(now/530) % 2 === 0)) { const h = .8*S, w = Math.max(2, S*.03); g.fillStyle = C.text; g.fillRect(cx - w/2, cy - h/2, w, h); }
}
function frame() {
  requestAnimationFrame(frame);
  const now = performance.now(), dt = Math.min(64, now - (lt || now)); lt = now;
  const k = 1 - Math.exp(-dt/80);
  Sd += (St - Sd)*k; cx += (ctx_ - cx)*k; cy += (cty - cy)*k;
  for (const l of letters) if (!l.dead && l.tx != null) { l.x += (l.tx - l.x)*k; l.y += (l.ty - l.y)*k; }
  letters = letters.filter(l => !(l.dead && now - l.dead > 300));
  paint(now, true);
}

/* ---------- start ---------- */
setPal(); resize(); frame();
const grew = () => { cacheClear(); layout(true); let i = 0; const chars = [...START]; (function next() { if (i < chars.length) { add(chars[i++], performance.now()); setTimeout(next, 90); } })(); };
const cacheClear = () => { for (const k in cache) delete cache[k]; };
const fonts = document.fonts ? Promise.all([document.fonts.load(`700 100px "Playfair Display"`), document.fonts.load(`700 100px "Noto Serif TC"`, '隋憶')]) : Promise.resolve();
Promise.race([fonts, new Promise(r => setTimeout(r, 2500))]).catch(() => {}).then(() => { grew(); setTimeout(() => { cacheClear(); layout(); }, 400); });
if (!matchMedia('(pointer: coarse)').matches) setTimeout(() => inp.focus({ preventScroll:true }), 50);
})();
</script>
