<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Irene 隋憶</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Serif+TC:wght@700&family=Playfair+Display:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        overscroll-behavior: none;
      }
      #app {
        position: fixed;
        inset: 0;
        cursor: text;
        font-family: "DM Mono", ui-monospace, monospace;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #in {
        position: fixed;
        left: 0;
        top: 0;
        width: 1px;
        height: 1px;
        opacity: 0;
        border: 0;
        padding: 0;
        font-size: 16px;
        pointer-events: none;
      }
      #bar {
        position: absolute;
        left: calc(24px + env(safe-area-inset-left));
        right: calc(24px + env(safe-area-inset-right));
        bottom: calc(20px + env(safe-area-inset-bottom));
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
        font-size: 12px;
        letter-spacing: 0.04em;
      }
      #hints {
        display: flex;
        gap: 18px;
        flex-wrap: wrap;
        opacity: 0.6;
      }
      #backBtn {
        position: absolute;
        top: calc(16px + env(safe-area-inset-top));
        left: calc(20px + env(safe-area-inset-left));
        z-index: 5;
        cursor: pointer;
        font: inherit;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.04em;
        color: #c8102e;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.6),
          rgba(255, 255, 255, 0.18)
        );
        border: 1px solid rgba(255, 255, 255, 0.75);
        border-radius: 999px;
        padding: 9px 18px;
        backdrop-filter: blur(14px) saturate(160%);
        -webkit-backdrop-filter: blur(14px) saturate(160%);
        box-shadow:
          0 8px 24px rgba(200, 16, 46, 0.16),
          inset 0 1px 0 rgba(255, 255, 255, 0.9),
          inset 0 -1px 0 rgba(255, 255, 255, 0.25);
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.6);
        transition:
          transform 0.12s,
          box-shadow 0.2s,
          background 0.2s;
        -webkit-tap-highlight-color: transparent;
      }
      #backBtn:hover {
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.8),
          rgba(255, 255, 255, 0.3)
        );
        box-shadow:
          0 10px 28px rgba(200, 16, 46, 0.24),
          inset 0 1px 0 #fff,
          inset 0 -1px 0 rgba(255, 255, 255, 0.35);
        transform: translateX(-2px);
      }
      #backBtn:active {
        transform: scale(0.95);
      }
      #backBtn:focus-visible {
        outline: 2px solid #274690;
        outline-offset: 3px;
      }
      @media (max-width: 600px) {
        #hints {
          gap: 10px;
          font-size: 11px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="cv"></canvas>
      <button
        id="backBtn"
        type="button"
        aria-label="Back to wishes"
        onclick="
          if (window.parent !== window) {
            parent.postMessage({ type: 'wx-garden-back' }, '*');
          } else {
            location.href = './index.html';
          }
        "
      >
        ←
      </button>
      <input
        id="in"
        aria-label="Type to grow a garden"
        autocapitalize="off"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
      />
    </div>
    <audio id="bgm" preload="auto"></audio>
    <script>
      /* Nhạc nền cho trang này khi mở đứng riêng (không có nút).
         Nếu đang nằm trong index (iframe) thì bỏ qua: index đã phát nhạc.
         Bài / đoạn đang nghe dùng chung với index qua localStorage "wx_bgm". */
      (function () {
        const a = document.getElementById("bgm");
        if (window.parent !== window) {
          a.remove();
          return;
        }
        const TRACKS = [
            "./audio/bgm.mp3",
            "./audio/bgm2.mp3",
            "./audio/bgm3.mp3",
          ],
          KEY = "wx_bgm";
        a.volume = 0.5;
        let idx = 0,
          fails = 0,
          want = true,
          unlocked = false,
          lastSave = 0;

        const readState = () => {
          try {
            return JSON.parse(localStorage.getItem(KEY)) || null;
          } catch (e) {
            return null;
          }
        };
        const saveState = (force) => {
          const now = Date.now();
          if (!force && now - lastSave < 1000) return;
          lastSave = now;
          try {
            localStorage.setItem(
              KEY,
              JSON.stringify({ idx, t: a.currentTime || 0, on: want, ts: now }),
            );
          } catch (e) {}
        };
        function load(i) {
          idx = (i + TRACKS.length) % TRACKS.length;
          a.src = TRACKS[idx];
          a.load();
        }
        function tryPlay() {
          if (!want) return;
          const p = a.play();
          if (p !== undefined)
            p.then(() => {
              fails = 0;
              unlocked = true;
              cleanup();
            }).catch(() => {});
        }
        function next() {
          load(idx + 1);
          if (want) tryPlay();
        }

        const sv = readState(),
          age = sv ? Date.now() - sv.ts : Infinity;
        if (sv && age < 30 * 60 * 1000) {
          want = sv.on !== false; // nếu bên index đã tắt nhạc thì ở đây cũng im
          const seek = (sv.t || 0) + (sv.on && age < 20000 ? age / 1000 : 0);
          load(sv.idx | 0);
          if (seek > 1)
            a.addEventListener(
              "loadedmetadata",
              () => {
                try {
                  if (!a.duration || seek < a.duration - 1)
                    a.currentTime = seek;
                } catch (e) {}
              },
              { once: true },
            );
        } else load(0);

        a.addEventListener("ended", next);
        a.addEventListener("error", () => {
          if (++fails < TRACKS.length) next();
        });
        a.addEventListener("timeupdate", () => saveState());
        ["play", "pause", "ended"].forEach((ev) =>
          a.addEventListener(ev, () => saveState(true)),
        );
        window.addEventListener("pagehide", () => saveState(true));

        // Trình duyệt chặn tự phát -> phát ở lần chạm / bấm phím đầu tiên
        const EVTS = ["click", "touchend", "keydown", "mousedown"];
        function onFirstInteract() {
          if (!unlocked && want) tryPlay();
        }
        function cleanup() {
          EVTS.forEach((ev) =>
            window.removeEventListener(ev, onFirstInteract, { capture: true }),
          );
        }
        EVTS.forEach((ev) =>
          window.addEventListener(ev, onFirstInteract, {
            capture: true,
            passive: true,
          }),
        );
        tryPlay();
      })();
    </script>
    <script>
      (() => {
        const START = "Irene 隋憶*•’•€"; // <- the text that grows on load
        /* Không lưu chữ: thoát ra vào lại (hoặc tải lại trang) là chạy lại từ đầu */
        const TEXT_KEY = "wx_garden_text";
        try {
          localStorage.removeItem(TEXT_KEY); // dọn chữ đã lưu từ các lần trước
        } catch (e) {}
        const savedText = () => null;
        const persistText = () => {};
        const F = '"Playfair Display","Noto Serif TC",Georgia,serif';
        const PAL = [
          ["Blush", "#FAD4D8", "#C8102E", "#274690", "#FFE3E6", "#1A1A1A"],
        ];
        const SPEED = 1.8; // growth speed: 1 = original, higher = faster
        let C = {};
        const setPal = () => {
          const p = PAL[0];
          C = {
            bg: p[1],
            red: p[2],
            blue: p[3],
            line: p[4],
            text: p[5],
            gr: ["#1F7A4D", "#2B9160", "#3FAE74"],
            pink: "#F08A9B",
            gold: "#E8A81C",
            brown: "#8B5A2B",
          };
          document.body.style.background = p[1];
        };
        const cv = document.getElementById("cv"),
          g = cv.getContext("2d"),
          inp = document.getElementById("in");
        let W,
          H,
          dpr,
          letters = [],
          uid = 1,
          Sd = 0,
          St = 0,
          cx = 0,
          cy = 0,
          ctx_ = 0,
          cty = 0,
          lastKey = 0,
          mx = null,
          my = 0,
          lt = 0,
          wrapped = false,
          kd = false;
        const cache = {},
          PI = Math.PI;
        const hs = (n) => {
          const x = Math.sin(n) * 43758.5453;
          return x - Math.floor(x);
        };
        const rng = (seed) => {
          let s = seed | 0;
          return () => {
            s = (s + 0x6d2b79f5) | 0;
            let t = Math.imul(s ^ (s >>> 15), 1 | s);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        };
        const eo = (t) => (t <= 0 ? 0 : t >= 1 ? 1 : 1 - Math.pow(1 - t, 3));
        const spr = (t, k = 7, w = 16) =>
          t <= 0 ? 0 : 1 - Math.exp(-t * k) * Math.cos(t * w);

        /* ---------- drawing primitives (smooth quadratic through midpoints) ---------- */
        function path(p, closed) {
          const n = p.length;
          if (n < 2) return;
          const m = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
          if (closed) {
            const s = m(p[n - 1], p[0]);
            g.moveTo(s[0], s[1]);
            for (let i = 0; i < n; i++) {
              const q = m(p[i], p[(i + 1) % n]);
              g.quadraticCurveTo(p[i][0], p[i][1], q[0], q[1]);
            }
            g.closePath();
          } else {
            g.moveTo(p[0][0], p[0][1]);
            for (let i = 1; i < n - 1; i++) {
              const q = m(p[i], p[i + 1]);
              g.quadraticCurveTo(p[i][0], p[i][1], q[0], q[1]);
            }
            g.lineTo(p[n - 1][0], p[n - 1][1]);
          }
        }
        const fillP = (p, col) => {
          g.beginPath();
          path(p, true);
          g.fillStyle = col;
          g.fill();
        };
        const strokeP = (p, col, w) => {
          g.beginPath();
          path(p, false);
          g.strokeStyle = col;
          g.lineWidth = w;
          g.lineCap = g.lineJoin = "round";
          g.stroke();
        };
        function strokeRange(P, a, b, col, w) {
          const n = P.length - 1,
            ia = a * n,
            ib = b * n;
          const lerp = (t) => {
            const i = Math.min(n - 1, Math.floor(t)),
              f = t - i;
            return [
              P[i][0] + (P[i + 1][0] - P[i][0]) * f,
              P[i][1] + (P[i + 1][1] - P[i][1]) * f,
            ];
          };
          const pts = [lerp(ia)];
          for (let i = Math.floor(ia) + 1; i < ib; i++) pts.push(P[i]);
          pts.push(lerp(ib));
          if (pts.length >= 2) strokeP(pts, col, w);
        }
        function vine(base, dir, len, amp, waves, ph, bend, n) {
          const P = [[base[0], base[1]]],
            step = len / n;
          let x = base[0],
            y = base[1];
          for (let i = 1; i <= n; i++) {
            const u = i / n,
              a =
                dir +
                bend * u +
                amp * Math.sin(u * PI * waves + ph) * Math.min(1, u * 3);
            x += Math.cos(a) * step;
            y += Math.sin(a) * step;
            P.push([x, y]);
          }
          return P;
        }
        function curl(P, sign, rad) {
          const n = P.length,
            e = P[n - 1],
            a = Math.atan2(e[1] - P[n - 2][1], e[0] - P[n - 2][0]);
          const c = [
              e[0] - Math.sin(a) * sign * rad,
              e[1] + Math.cos(a) * sign * rad,
            ],
            a0 = Math.atan2(e[1] - c[1], e[0] - c[0]);
          for (let i = 1; i <= 14; i++) {
            const u = i / 14,
              t = a0 + sign * u * PI * 1.6,
              rr = rad * (1 - 0.5 * u);
            P.push([c[0] + Math.cos(t) * rr, c[1] + Math.sin(t) * rr]);
          }
          return P;
        }
        function bez(a, b, c, d, n) {
          const P = [];
          for (let i = 0; i <= n; i++) {
            const t = i / n,
              u = 1 - t;
            P.push([
              u * u * u * a[0] +
                3 * u * u * t * b[0] +
                3 * u * t * t * c[0] +
                t * t * t * d[0],
              u * u * u * a[1] +
                3 * u * u * t * b[1] +
                3 * u * t * t * c[1] +
                t * t * t * d[1],
            ]);
          }
          return P;
        }
        function at(P, u) {
          const n = P.length,
            i = Math.min(n - 2, Math.max(1, Math.round(u * (n - 1))));
          return [
            P[i],
            Math.atan2(P[i + 1][1] - P[i - 1][1], P[i + 1][0] - P[i - 1][0]),
          ];
        }
        const layerAt = (segs, u) =>
          u < segs[0].u1 ? segs[0].layer : segs[1].layer;

        function leaf(bx, by, a, L, bend, col, vein) {
          if (L < 0.5) return;
          const ca = Math.cos(a),
            sa = Math.sin(a),
            px = -sa,
            py = ca;
          const ax = (u) => {
            const b = Math.sin(PI * u) * bend * 0.15 * L;
            return [bx + ca * u * L + px * b, by + sa * u * L + py * b];
          };
          const hw = (u) => L * 0.18 * Math.sin(PI * Math.pow(u, 0.8)),
            N = 12,
            s1 = [],
            s2 = [];
          for (let i = 0; i <= N; i++) {
            const u = i / N,
              c = ax(u),
              w = hw(u);
            s1.push([c[0] + px * w, c[1] + py * w]);
            s2.push([c[0] - px * w, c[1] - py * w]);
          }
          const tip = ax(1),
            base = ax(0);
          fillP(
            [
              base,
              ...s1.slice(1, N),
              tip,
              tip,
              ...s2.slice(1, N).reverse(),
              base,
            ],
            col,
          );
          if (L > 6) {
            const v = [];
            for (let i = 0; i <= 8; i++) v.push(ax(0.08 + (0.72 * i) / 8));
            strokeP(v, vein, Math.max(0.8, L * 0.03));
          }
        }
        function rose(x0, y0, R, rot, e, a) {
          const cr = Math.cos(rot),
            sr = Math.sin(rot),
            T = (x, y) => [x0 + x * cr - y * sr, y0 + x * sr + y * cr];
          const P = [
            [0, -0.36, 0.56, 0.54, 0, 0],
            [-0.5, -0.06, 0.6, 0.6, -0.35, 0],
            [0.52, -0.06, 0.6, 0.6, 0.35, 0],
            [-0.42, 0.3, 0.62, 0.48, 0.2, 1],
            [0.47, 0.3, 0.62, 0.48, -0.2, 1],
            [0.05, 0.42, 0.56, 0.38, 0, 0],
          ];
          const lw = Math.max(0.8, R * 0.045),
            st = 85;
          P.forEach((q, i) => {
            const s = spr((a - i * st) / 1000, 8, 14);
            if (s <= 0.001) return;
            const open = (1 - Math.min(1, s)) * (q[0] < 0 ? 0.5 : -0.5),
              ang = q[4] + open,
              ca = Math.cos(ang),
              sa = Math.sin(ang);
            const pt = (th) => {
              const rr =
                  1 +
                  0.08 * Math.sin(3 * th + e.ph1 + i) +
                  0.04 * Math.sin(5 * th + e.ph2),
                lx = Math.cos(th) * q[2] * rr,
                ly = Math.sin(th) * q[3] * rr;
              return T(
                (q[0] + lx * ca - ly * sa) * s * R,
                (0.5 + (q[1] + lx * sa + ly * ca - 0.5) * s) * R,
              );
            };
            const pts = [];
            for (let k = 0; k < 26; k++) pts.push(pt((k / 26) * PI * 2));
            fillP(pts, C.red);
            if (q[5] && R >= 12 && s > 0.4) {
              const arc = [];
              for (let k = 0; k <= 14; k++)
                arc.push(pt(PI * (1.18 + (0.64 * k) / 14)));
              strokeRange(
                arc,
                0,
                Math.min(1, (s - 0.4) / 0.5),
                C.line,
                lw * 0.8,
              );
            }
          });
          const fr = eo((a - P.length * st - 80) / 520);
          if (fr > 0 && R > 3) {
            const sp = [],
              turns =
                R < 20
                  ? Math.min(e.turns, 1.3)
                  : R < 32
                    ? e.turns * 0.8
                    : e.turns;
            for (let i = 0; i <= 70; i++) {
              const u = i / 70,
                th = e.ph1 + u * turns * PI * 2,
                rr = R * (0.08 + 0.57 * u);
              sp.push(
                T(
                  Math.cos(th) * rr * 1.05,
                  Math.sin(th) * rr * 0.72 - 0.12 * R,
                ),
              );
            }
            strokeRange(sp, 0, fr, C.line, lw);
            if (R >= 14) {
              const sc = [];
              for (let i = 0; i <= 36; i++) {
                const u = i / 36;
                sc.push(
                  T(
                    (-0.72 + 1.5 * u) * R,
                    0.36 * R + 0.16 * R * Math.abs(Math.sin(u * PI * 3)),
                  ),
                );
              }
              strokeRange(sc, 0, fr, C.line, lw);
            }
          }
        }

        /* ---------- christmas ornaments ---------- */
        const pk = (r) => {
          const x = r();
          return x < 0.22
            ? "tree"
            : x < 0.42
              ? "bell"
              : x < 0.54
                ? "star"
                : x < 0.72
                  ? "ball"
                  : x < 0.84
                    ? "candy"
                    : x < 0.94
                      ? "holly"
                      : "rose";
        };
        function xmas(k, x0, y0, R, rot, e, a) {
          const s = Math.max(0, spr(a / 1000, 8, 14));
          if (s <= 0.001) return;
          g.save();
          g.translate(x0, y0);
          g.rotate(
            rot * (k === "star" || k === "candy" ? 1 : 0.55) +
              (k === "bell"
                ? Math.sin(performance.now() / 450 + e.ph1) * 0.1
                : 0),
          );
          const U = R * 1.1 * s;
          g.scale(U, U);
          g.lineCap = g.lineJoin = "round";
          const poly = (pts, col) => {
            g.beginPath();
            pts.forEach((q, i) =>
              i ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1]),
            );
            g.closePath();
            g.fillStyle = g.strokeStyle = col;
            g.lineWidth = 0.08;
            g.fill();
            g.stroke();
          };
          const dot = (x, y, r, col) => {
            g.beginPath();
            g.arc(x, y, r, 0, PI * 2);
            g.fillStyle = col;
            g.fill();
          };
          const star = (x, y, r, col) => {
            g.beginPath();
            for (let i = 0; i < 10; i++) {
              const rr = i % 2 ? r * 0.45 : r,
                th = -PI / 2 + (i * PI) / 5,
                px = x + Math.cos(th) * rr,
                py = y + Math.sin(th) * rr;
              i ? g.lineTo(px, py) : g.moveTo(px, py);
            }
            g.closePath();
            g.fillStyle = g.strokeStyle = col;
            g.lineWidth = 0.06;
            g.fill();
            g.stroke();
          };
          if (k === "tree") {
            g.fillStyle = C.brown;
            g.fillRect(-0.13, 0.55, 0.26, 0.45);
            poly(
              [
                [0, -0.25],
                [0.92, 0.62],
                [-0.92, 0.62],
              ],
              C.gr[0],
            );
            poly(
              [
                [0, -0.65],
                [0.7, 0.2],
                [-0.7, 0.2],
              ],
              C.gr[1],
            );
            poly(
              [
                [0, -1],
                [0.48, -0.3],
                [-0.48, -0.3],
              ],
              C.gr[2],
            );
            dot(-0.45, 0.42, 0.09, C.red);
            dot(0.38, 0.5, 0.09, C.blue);
            dot(0, 0.2, 0.08, C.line);
            dot(-0.2, -0.05, 0.07, C.red);
            dot(0.22, -0.08, 0.07, C.blue);
            star(0, -1.02, 0.2, C.blue);
          } else if (k === "bell") {
            g.beginPath();
            g.moveTo(-0.1, -0.75);
            g.bezierCurveTo(-0.55, -0.7, -0.45, 0.1, -0.85, 0.5);
            g.lineTo(0.85, 0.5);
            g.bezierCurveTo(0.45, 0.1, 0.55, -0.7, 0.1, -0.75);
            g.closePath();
            g.fillStyle = C.gold;
            g.fill();
            g.beginPath();
            g.moveTo(-0.85, 0.52);
            g.lineTo(0.85, 0.52);
            g.strokeStyle = C.gold;
            g.lineWidth = 0.14;
            g.stroke();
            dot(0, 0.7, 0.17, C.gold);
            g.beginPath();
            g.moveTo(-0.3, -0.4);
            g.quadraticCurveTo(-0.4, 0, -0.52, 0.28);
            g.strokeStyle = "rgba(255,255,255,.55)";
            g.lineWidth = 0.07;
            g.stroke();
            poly(
              [
                [0, -0.8],
                [-0.4, -1],
                [-0.4, -0.6],
              ],
              C.red,
            );
            poly(
              [
                [0, -0.8],
                [0.4, -1],

              l.els.forEach(each);
              if (l.endEls) l.endEls.forEach(each);
              const i = act.indexOf(l),
                nx = i >= 0 ? act[i + 1] : null;
              if (l.tend && (l.dead || !nx || nx.ch === " ")) {
                let fr = eo(((now - l.tb) * SPEED - 150) / 450);
                if (l.cut != null)
                  fr *=
                    1 -
                    eo(((now - l.cut) * SPEED) / 150) *
                      Math.min(0.85, 20 / (0.6 * S));
                for (const e of l.tend) stem(e, l, age, kk, layer, fr * kk);
              }
            }
          };
          draw(0);
          for (const l of L)
            if (l.ch !== " " && !l.dead) {
              g.font = `700 ${S}px ${F}`;
              g.textAlign = "center";
              g.textBaseline = "alphabetic";
              g.fillStyle = C.text;
              g.fillText(l.ch, l.x, l.y);
            }
          draw(1);
          if (
            caret &&
            (now - lastKey < 500 || Math.floor(now / 530) % 2 === 0)
          ) {
            const h = 0.8 * S,
              w = Math.max(2, S * 0.03);
            g.fillStyle = C.text;
            g.fillRect(cx - w / 2, cy - h / 2, w, h);
          }
        }
        function frame() {
          requestAnimationFrame(frame);
          const now = performance.now(),
            dt = Math.min(64, now - (lt || now));
          lt = now;
          const k = 1 - Math.exp(-dt / 80);
          Sd += (St - Sd) * k;
          cx += (ctx_ - cx) * k;
          cy += (cty - cy) * k;
          for (const l of letters)
            if (!l.dead && l.tx != null) {
              l.x += (l.tx - l.x) * k;
              l.y += (l.ty - l.y) * k;
            }
          letters = letters.filter((l) => !(l.dead && now - l.dead > 300));
          paint(now, false);
        }

        /* ---------- start ---------- */
        setPal();
        resize();
        frame();
        const grew = () => {
          cacheClear();
          layout(true);
          let i = 0;
          const chars = [...(savedText() || START)];
          (function next() {
            if (i < chars.length) {
              add(chars[i++], performance.now());
              setTimeout(next, 90);
            }
          })();
        };
        const cacheClear = () => {
          for (const k in cache) delete cache[k];
        };
        const fonts = document.fonts
          ? Promise.all([
              document.fonts.load(`700 100px "Playfair Display"`),
              document.fonts.load(`700 100px "Noto Serif TC"`, "隋憶"),
            ])
          : Promise.resolve();
        Promise.race([fonts, new Promise((r) => setTimeout(r, 2500))])
          .catch(() => {})
          .then(() => {
            grew();
            setTimeout(() => {
              cacheClear();
              layout();
            }, 400);
          });
        if (!matchMedia("(pointer: coarse)").matches)
          setTimeout(() => inp.focus({ preventScroll: true }), 50);
        // Khi được mở lại từ trang cha (iframe): focus lại để gõ chữ ngay
        window.addEventListener("message", (e) => {
          if (e.data && e.data.type === "wx-garden-show") {
            if (!matchMedia("(pointer: coarse)").matches)
              inp.focus({ preventScroll: true });
          }
        });
      })();
    </script>
  </body>
</html>
